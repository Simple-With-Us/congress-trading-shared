name: Claude Code Autofix (Reusable)

# Shared infrastructure for the PR autofix loop - called by individual repos that
# want the same triggers / permissions / Claude action config.  Each repo supplies
# its own prompt so behaviour stays auditable in-repo.  The filename still says
# "codex" on purpose:  callers pin this file by SHA and path, so renaming it would
# break every pin.  The display name is what changed.
#
# The agent runs claude-code-action against MiniMax's Anthropic-compatible
# endpoint (https://api.minimax.io/anthropic), billed to the org secret
# MINIMAX_API_KEY.  It acts on reviews from Codex, Kody and Cursor.
#
# To onboard a new repo:
#   1. No per-repo model key is needed:  MINIMAX_API_KEY is an organization secret
#      visible to every repo.  The caller only has to pass it through
#      (`secrets: MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}`).  GH_PAT is
#      optional and, when the repo has it, should be passed through the same way
#      so the fixer's pushes re-trigger CI and the reviewers.
#   2. Create .github/workflows/claude-autofix.yml (or keep an existing
#      codex-autofix.yml) from the caller template below.
#   3. Caller workflows must trigger on `pull_request_review` with
#      `types: [submitted]` plus `workflow_dispatch` only.  Do not trigger on
#      pull_request_review_comment or issue_comment;  one review can contain many
#      comments, and comment events can fan out into autofix storms.
#   4. Callers MUST set this concurrency block, and the group name must be exactly
#      this string.  It is shared on purpose with the fleet's other autofix caller
#      (AI-Fleet-Coordinator pr-autofix-reusable.yml), so two bots never push to
#      one PR branch at once:
#
#        concurrency:
#          group: pr-autofix-${{ github.repository }}-${{ github.event.pull_request.number }}
#          cancel-in-progress: false
#
#      (A reusable workflow cannot set this for its caller, so it lives in the
#      caller.  For workflow_dispatch runs, use the dispatched PR number input in
#      place of github.event.pull_request.number.)
#
# Caller template:
#
#   name: Claude Code Autofix
#   on:
#     pull_request_review:
#       types: [submitted]
#     workflow_dispatch:
#       inputs:
#         pr:
#           description: "PR number to run the autofix loop on"
#           required: true
#   permissions:
#     contents: write
#     pull-requests: write
#   concurrency:
#     group: pr-autofix-${{ github.repository }}-${{ github.event.pull_request.number || github.event.inputs.pr }}
#     cancel-in-progress: false
#   jobs:
#     autofix:
#       if: >-
#         github.event_name == 'workflow_dispatch' ||
#         (github.event_name == 'pull_request_review' &&
#          github.event.review.user.type == 'Bot' &&
#          github.event.pull_request.head.repo.full_name == github.repository)
#       uses: Simple-With-Us/congress-trading-shared/.github/workflows/codex-autofix-reusable.yml@<merge sha>
#       secrets:
#         MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
#         GH_PAT: ${{ secrets.GH_PAT }}
#       with:
#         prompt: |
#           <repo-specific fixer policy>
#
# Org-level alternative (preferred):
#   Move this file to jaywedgeworth22/.github/workflows/codex-autofix-reusable.yml
#   and call it as jaywedgeworth22/.github/workflows/codex-autofix-reusable.yml@main.
#   See docs/how-to-setup-org-dot-github.md for setup steps.

on:
  workflow_call:
    inputs:
      prompt:
        required: true
        type: string
        description: "Full prompt for the Claude autofix agent"
      claude_args:
        required: false
        type: string
        default: |
          --max-turns 60
          --allowedTools "Edit,Write,Read,Bash"
        description: "Extra CLI args passed to claude-code-action"
      allowed_bots:
        required: false
        type: string
        default: "chatgpt-codex-connector,chatgpt-codex-connector[bot],kody-ai,kody-ai[bot],cursor,cursor[bot]"
        description: "Allowed bot actors (normalised by the action: lowercased, [bot] stripped)"
      model:
        required: false
        type: string
        default: "MiniMax-M3.1-Flash-Preview"
        description: "MiniMax model id sent as ANTHROPIC_MODEL / ANTHROPIC_SMALL_FAST_MODEL"
    secrets:
      MINIMAX_API_KEY:
        required: true
      GH_PAT:
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  autofix:
    # Intentionally kept on hosted runners (NOT migrated to the fleet self-hosted
    # CI runners). This is a reusable workflow invoked cross-repo, so a
    # `vars.*`-gated runs-on would resolve against the *caller's* variables, and
    # the job itself runs claude-code-action (a code-writing agent doing network
    # installs) — the worst fit to run beside production containers + a
    # repo-scoped runner PAT on the shared box. Under a $0 hosted-minutes cap
    # this autofix convenience loop would simply not start; that is accepted.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1
        # Routed to MiniMax via its Anthropic-compatible endpoint:  claude-code-action
        # drives the Claude Code CLI, which honors ANTHROPIC_BASE_URL / _AUTH_TOKEN /
        # _MODEL, so this bills the org MINIMAX_API_KEY instead of Anthropic.  Same
        # endpoint and key wiring as the fleet's other autofix workflows.  The model
        # id comes from the `model` input (MiniMax-M3.1-Flash-Preview, the id the
        # fleet's Harness route already uses over api anthropic-messages).
        env:
          ANTHROPIC_BASE_URL: https://api.minimax.io/anthropic
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.MINIMAX_API_KEY }}
          ANTHROPIC_MODEL: ${{ inputs.model }}
          ANTHROPIC_SMALL_FAST_MODEL: ${{ inputs.model }}
        with:
          anthropic_api_key: ${{ secrets.MINIMAX_API_KEY }}
          github_token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          allowed_bots: ${{ inputs.allowed_bots }}
          prompt: ${{ inputs.prompt }}
          claude_args: ${{ inputs.claude_args }}
          # claude-code-action's buffered-inline-comment classifier hardcodes
          # https://api.anthropic.com and reads anthropic_api_key directly,
          # ignoring ANTHROPIC_BASE_URL - with a MiniMax key it would 401 and
          # fall back to posting every buffered comment unfiltered. Disable the
          # feature rather than rely on a classifier that can't authenticate.
          classify_inline_comments: "false"
