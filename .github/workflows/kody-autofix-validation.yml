name: Kody Autofix Offline Validation

on:
  pull_request:
    paths:
      - '.github/kody-autofix/**'
      - '.github/workflows/kody-autofix-reusable.yml'
      - '.github/workflows/kody-autofix-validation.yml'
  push:
    paths:
      - '.github/kody-autofix/**'
      - '.github/workflows/kody-autofix-reusable.yml'
      - '.github/workflows/kody-autofix-validation.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Run Offline Controller And Caller Tests
        run: node --test .github/kody-autofix/*.node-test.mjs
